services:

  # ── PostgreSQL database ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_DATABASE:-helpdesk}
      POSTGRES_USER:     ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"        # expose for local DB tools (TablePlus, DBeaver, etc.)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Laravel (PHP-FPM) ─────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    volumes:
      # Mount source for development hot-reload; remove in CI/CD
      - ./backend:/var/www/laravel
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
      # Keep vendor out of the host mount so container-built deps are used
      - backend_vendor:/var/www/laravel/vendor
    environment:
      APP_ENV:       ${APP_ENV:-local}
      APP_KEY:       ${APP_KEY}
      APP_DEBUG:     ${APP_DEBUG:-true}
      DB_CONNECTION: pgsql
      DB_HOST:       db
      DB_PORT:       5432
      DB_DATABASE:   ${DB_DATABASE:-helpdesk}
      DB_USERNAME:   ${DB_USERNAME:-postgres}
      DB_PASSWORD:   ${DB_PASSWORD:-secret}
    depends_on:
      db:
        condition: service_healthy

  # ── Nginx (reverse proxy → PHP-FPM) ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"          # Laravel API available at http://localhost:8000
    volumes:
      - ./backend/public:/var/www/laravel/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  # ── Next.js frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Baked into the Next.js build; points to the Nginx proxy
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    restart: unless-stopped
    ports:
      - "3000:3000"        # Frontend available at http://localhost:3000
    environment:
      NODE_ENV: production
    depends_on:
      - nginx

volumes:
  pgdata:
  backend_vendor:

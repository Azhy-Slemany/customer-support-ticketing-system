services:

  # ── PostgreSQL database ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_DATABASE:-helpdesk}
      POSTGRES_USER:     ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Laravel (php artisan serve) ───────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/laravel
      - backend_vendor:/var/www/laravel/vendor
    environment:
      APP_ENV:       ${APP_ENV:-local}
      APP_KEY:       ${APP_KEY}
      APP_DEBUG:     ${APP_DEBUG:-true}
      DB_CONNECTION: pgsql
      DB_HOST:       db
      DB_PORT:       5432
      DB_DATABASE:   ${DB_DATABASE:-helpdesk}
      DB_USERNAME:   ${DB_USERNAME:-postgres}
      DB_PASSWORD:   ${DB_PASSWORD:-secret}
    depends_on:
      db:
        condition: service_healthy

  # ── Next.js frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend

volumes:
  pgdata:
  backend_vendor: